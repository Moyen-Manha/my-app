<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    .wrapper {
      position: absolute;
      top: -25px; /* ব্যানারটিকে স্ক্রিনের ওপরের অংশে ঠেলে ঢেকে দেওয়া হয়েছে */
      left: 0;
      width: 100%;
      height: calc(100% + 55px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <iframe src="https://script.google.com/macros/s/AKfycbyLJo4qnKWjefDHB6FRx41McO4l7-28jJEueqKJ7zuuTJtF_JCz-_e6zZ2rgejl9L_-gg/exec"></iframe>
  </div>

</body>
</html>
